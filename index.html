<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>Melek & Mustafa — Bir Aşk Hikayesi</title>
				<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
					<style>
						*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

						:root {
						--rose: #e8547a;
						--rose-light: #f08fa8;
						--rose-pale: #fce4ec;
						--gold: #d4a96a;
						--deep: #0d0812;
						--mid: #1a0f24;
						--text: #f5e6f0;
						--muted: #9e7a8a;
						}

						html { scroll-behavior: smooth; }

						body {
						background: var(--deep);
						color: var(--text);
						font-family: 'Montserrat', sans-serif;
						font-weight: 200;
						overflow-x: hidden;
						cursor: default;
						}

						/* ── CANVAS STARS ── */
						#starsCanvas {
						position: fixed;
						top: 0; left: 0;
						width: 100%; height: 100%;
						pointer-events: none;
						z-index: 0;
						}

						/* ── SECTIONS ── */
						section {
						position: relative;
						z-index: 1;
						min-height: 100vh;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						padding: 60px 24px;
						}

						/* ── HERO ── */
						#hero {
						text-align: center;
						gap: 28px;
						}

						#heroHeart {
						width: 280px;
						height: 280px;
						margin: 0 auto 16px;
						}

						.hero-names {
						font-family: 'Great Vibes', cursive;
						font-size: clamp(52px, 10vw, 88px);
						background: linear-gradient(135deg, var(--rose-light), var(--gold), var(--rose));
						-webkit-background-clip: text;
						-webkit-text-fill-color: transparent;
						background-clip: text;
						line-height: 1.3;
						padding: 10px 0;
						animation: fadeUp 1.4s ease both;
						}

						.hero-sub {
						font-size: 11px;
						letter-spacing: 6px;
						text-transform: uppercase;
						color: var(--muted);
						animation: fadeUp 1.8s ease both;
						}

						.scroll-hint {
						position: absolute;
						bottom: 32px;
						left: 50%;
						display: flex;
						flex-direction: column;
						align-items: center;
						gap: 15px;
						animation: fadeUpCentered 2.2s ease both;
						}
						.scroll-hint span {
						font-size: 9px;
						letter-spacing: 4px;
						color: var(--muted);
						text-transform: uppercase;
						animation: pulseText 2s infinite;
						}
						.chevron {
						width: 18px; height: 18px;
						border-right: 1px solid var(--muted);
						border-bottom: 1px solid var(--muted);
						transform: rotate(45deg);
						animation: bounce 2s ease infinite;
						}

						/* ── COUNTDOWN ── */
						#countdown {
						text-align: center;
						gap: 48px;
						background: radial-gradient(ellipse at center, #1f0d2e 0%, transparent 70%);
						}

						.section-label {
						font-family: 'Cormorant Garamond', serif;
						font-size: 16px;
						font-style: italic;
						letter-spacing: 4px;
						color: var(--rose-light);
						margin-bottom: -24px;
						}

						.section-title {
						font-family: 'Cormorant Garamond', serif;
						font-size: clamp(28px, 5vw, 44px);
						font-weight: 300;
						font-style: italic;
						color: var(--text);
						margin-bottom: 8px;
						}

						.timer-grid {
						display: flex;
						gap: 20px;
						flex-wrap: wrap;
						justify-content: center;
						}

						.timer-box {
						display: flex;
						flex-direction: column;
						align-items: center;
						gap: 10px;
						min-width: 90px;
						}

						.timer-num {
						font-family: 'Cormorant Garamond', serif;
						font-size: clamp(52px, 10vw, 80px);
						font-weight: 300;
						line-height: 1;
						background: linear-gradient(160deg, #fff 20%, var(--rose-light) 80%);
						-webkit-background-clip: text;
						-webkit-text-fill-color: transparent;
						background-clip: text;
						transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
						min-width: 90px;
						text-align: center;
						}

						.timer-num.bump { transform: scale(1.15); }

						.timer-label {
						font-size: 9px;
						letter-spacing: 4px;
						text-transform: uppercase;
						color: var(--muted);
						}

						.timer-divider {
						font-family: 'Cormorant Garamond', serif;
						font-size: 56px;
						font-weight: 300;
						color: var(--muted);
						line-height: 1;
						margin-top: -12px;
						opacity: 0.4;
						}

						.total-seconds {
						font-family: 'Cormorant Garamond', serif;
						font-size: 18px;
						font-style: italic;
						color: var(--muted);
						}

						.total-seconds strong {
						font-weight: 400;
						background: linear-gradient(90deg, var(--rose-light), var(--gold));
						-webkit-background-clip: text;
						-webkit-text-fill-color: transparent;
						background-clip: text;
						}

						/* ── LETTER ── */
						#letter {
						align-items: flex-start;
						max-width: 700px;
						margin: 0 auto;
						background: radial-gradient(ellipse at 30% 50%, #1e0a2e 0%, transparent 65%);
						}

						.letter-card {
						background: rgba(255,255,255,0.03);
						border: 1px solid rgba(232,84,122,0.15);
						border-radius: 2px;
						padding: clamp(36px, 6vw, 64px);
						max-width: 620px;
						width: 100%;
						position: relative;
						backdrop-filter: blur(8px);
						box-sizing: border-box;
						}

						.letter-card::before {
						content: '';
						position: absolute;
						top: 0; left: 0; right: 0;
						height: 1px;
						background: linear-gradient(90deg, transparent, var(--rose), transparent);
						}

						.letter-emoji {
						font-size: 28px;
						margin-bottom: 24px;
						display: block;
						}

						.letter-salute {
						font-family: 'Great Vibes', cursive;
						font-size: clamp(32px, 5vw, 48px);
						color: var(--rose-light);
						margin-bottom: 28px;
						line-height: 1;
						}

						.letter-body {
						font-family: 'Cormorant Garamond', serif;
						font-size: clamp(16px, 2vw, 19px);
						font-weight: 300;
						line-height: 1.95;
						color: rgba(245,230,240,0.85);
						}

						.letter-body p { margin-bottom: 20px; word-wrap: break-word; overflow-wrap: break-word; }

						.letter-sign {
						margin-top: 36px;
						font-family: 'Cormorant Garamond', serif;
						font-style: italic;
						font-size: clamp(14px, 2vw, 16px);
						color: var(--rose-light);
						text-align: right;
						border-top: 1px solid rgba(232,84,122,0.15);
						padding-top: 20px;
						}

						/* ── FLOATING HEARTS ── */
						.float-heart {
						position: fixed;
						pointer-events: none;
						z-index: 9999;
						font-size: 16px;
						animation: floatUp 3s ease forwards;
						opacity: 0;
						}

						/* ── FOOTER ── */
						footer {
						text-align: center;
						padding: 30px 20px;
						font-size: 12px;
						color: var(--muted);
						font-family: 'Montserrat', sans-serif;
						letter-spacing: 2px;
						position: relative;
						z-index: 2;
						}

						/* ── ANIMATIONS ── */
						@keyframes fadeUp {
						from { opacity: 0; transform: translateY(24px); }
						to   { opacity: 1; transform: translateY(0); }
						}

						@keyframes fadeUpCentered {
						from { opacity: 0; transform: translate(-50%, 24px); }
						to   { opacity: 1; transform: translate(-50%, 0); }
						}

						@keyframes bounce {
						0%, 100% { transform: rotate(45deg) translateY(0); }
						50%       { transform: rotate(45deg) translateY(6px); }
						}

						@keyframes pulseText {
						0%, 100% { opacity: 1; }
						50%      { opacity: 0.3; }
						}

						@keyframes floatUp {
						0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(-10deg); }
						20%  { opacity: 1; }
						100% { opacity: 0; transform: translateY(-200px) scale(1.4) rotate(15deg); }
						}

						/* ── TYPEWRITER ── */
						.typewriter-wrap {
						display: inline;
						border-right: 2px solid var(--rose);
						animation: typingCursor 0.75s step-end infinite;
						}

						@keyframes typingCursor {
						from, to { border-color: transparent; }
						50% { border-color: var(--rose); }
						}

						/* ── SECTION DIVIDER ── */
						.divider {
						width: 80px;
						height: 1px;
						background: linear-gradient(90deg, transparent, var(--rose), transparent);
						margin: 0 auto;
						}

						/* ── NAV DOTS ── */
						#navDots {
						position: fixed;
						right: 28px;
						top: 50%;
						transform: translateY(-50%);
						display: flex;
						flex-direction: column;
						gap: 14px;
						z-index: 100;
						}

						.nav-dot {
						width: 6px; height: 6px;
						border-radius: 50%;
						background: var(--muted);
						cursor: pointer;
						transition: all 0.3s ease;
						border: 1px solid transparent;
						}

						.nav-dot.active {
						background: var(--rose);
						transform: scale(1.4);
						box-shadow: 0 0 8px var(--rose);
						}

						/* ── CLICK RIPPLE ── */
						.ripple {
						position: fixed;
						pointer-events: none;
						border-radius: 50%;
						border: 1px solid var(--rose);
						z-index: 9998;
						animation: rippleOut 0.8s ease forwards;
						}

						@keyframes rippleOut {
						from { width: 0; height: 0; opacity: 0.8; transform: translate(-50%, -50%); }
						to   { width: 80px; height: 80px; opacity: 0; transform: translate(-50%, -50%); }
						}

						/* ── SCROLLBAR ── */
						::-webkit-scrollbar { width: 4px; }
						::-webkit-scrollbar-track { background: var(--deep); }
						::-webkit-scrollbar-thumb { background: var(--rose); border-radius: 2px; }

						@media (max-width: 480px) {
						.timer-divider { display: none; }
						.letter-card { padding: 28px 20px; }
						}
					</style>
				</head>
	<body>

		<canvas id="starsCanvas"></canvas>

		<div id="navDots">
			<div class="nav-dot active" onclick="scrollTo(0,0)" title="Başlangıç"></div>
			<div class="nav-dot" onclick="document.getElementById('countdown').scrollIntoView({behavior:'smooth'})" title="Süremiz"></div>
			<div class="nav-dot" onclick="document.getElementById('letter').scrollIntoView({behavior:'smooth'})" title="Mektup"></div>
		</div>

		<section id="hero">
			<svg id="heroHeart" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>

			<h1 class="hero-names">Melek &amp; Mustafa</h1>
			<p class="hero-sub">Bir Aşk Hikayesi</p>

			<div class="scroll-hint">
				<span>Aşağı kaydır</span>
				<div class="chevron"></div>
			</div>
		</section>

		<section id="countdown">
			<p class="section-label">Birlikte geçirdiğimiz zaman</p>
			<h2 class="section-title">Her saniye değerli...</h2>
			<div class="divider" style="margin-bottom:0;"></div>

			<div class="timer-grid">
				<div class="timer-box">
					<div class="timer-num" id="tDays">0</div>
					<div class="timer-label">Gün</div>
				</div>
				<div class="timer-divider">:</div>
				<div class="timer-box">
					<div class="timer-num" id="tHours">0</div>
					<div class="timer-label">Saat</div>
				</div>
				<div class="timer-divider">:</div>
				<div class="timer-box">
					<div class="timer-num" id="tMins">0</div>
					<div class="timer-label">Dakika</div>
				</div>
				<div class="timer-divider">:</div>
				<div class="timer-box">
					<div class="timer-num" id="tSecs">0</div>
					<div class="timer-label">Saniye</div>
				</div>
			</div>

			<p class="total-seconds">
				Toplamda <strong id="totalSecs">—</strong> saniye birlikte 💜
			</p>
		</section>

		<section id="letter">
			<div class="letter-card">
				<span class="letter-emoji">💌</span>
				<div class="letter-salute">Sevgili Melek,</div>
				<div class="letter-body" id="letterText"></div>
				<div class="letter-sign">Seninle her saniye değerli... — Mustafa 💜</div>
			</div>
		</section>

		<footer>
			Created by Mustafa 🤍 Specially Melek - 2026
		</footer>

		<script>
			// ═══════════════════════════════════════
			// CONFIG — sadece burayı değiştir
			// ═══════════════════════════════════════
			const START_DATE = new Date('2026-05-26T00:00:00');

			const LETTER_PARAGRAPHS = [
			"Seninle geçirdiğim her an, hayatımın en güzel sayfaları...",
			"Bazen bir insanla tanışırsın ve içinden bir ses 'işte o' der. Seni ilk gördüğümde tam olarak böyle hissettim.",
			"Gülüşün dünyayı daha güzel yapıyor. Bakışların huzur veriyor. Seninle konuşurken zaman nasıl geçiyor anlamıyorum.",
			"Her sabah seni düşünerek uyanmak,\nher gece seninle konuşarak uyumak...\nBu ayrıcalık benim için paha biçilemez.",
			"Sen sadece bir isim değilsin benim için —\nsen bir his, bir yuva, bir anlam...",
			"Seni çok seviyorum, Melek. 🌹"
			];
			// ═══════════════════════════════════════

			// ── ZARİF VE SAKİN GECE GÖKYÜZÜ YILDIZLARI ──
			const canvas = document.getElementById('starsCanvas');
			const ctx = canvas.getContext('2d');
			let stars = [], shooting = [];

			function resize() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			initStars();
			}
			resize();
			window.addEventListener('resize', resize);

			function initStars() {
			// Yıldız sayısı ve boyutları gözü yormayacak şekilde optimize edildi
			stars = Array.from({length: 160}, () => ({
			x: Math.random() * canvas.width,
			y: Math.random() * canvas.height,
			r: Math.random() * 1.1 + 0.3, // Çok küçük ve estetik
			speed: Math.random() * 0.001 + 0.0004, // Aşırı yavaş, huzurlu parıltı hızı
			phase: Math.random() * Math.PI * 2,
			baseOpacity: Math.random() * 0.3 + 0.4, // Temel parlaklık düzeyi
			twinkleRange: Math.random() * 0.2 + 0.1 // Göz kırpma değil, hafif bir parıltı dalgalanması
			}));
			}
			initStars();

			function spawnShootingStar() {
			if (Math.random() > 0.004) return; // Kayan yıldızlar da nadir ve kıymetli hale getirildi
			shooting.push({
			x: Math.random() * canvas.width * 0.7,
			y: Math.random() * canvas.height * 0.4,
			len: Math.random() * 100 + 50,
			speed: Math.random() * 4 + 3,
			alpha: 1,
			angle: Math.PI / 5
			});
			}

			function drawStars(time) {
			ctx.clearRect(0, 0, canvas.width, canvas.height);

			stars.forEach(s => {
			// Yıldızlar sabit yerlerinde duruyor, sadece nefes alır gibi çok hafifçe parlıyor
			const a = s.baseOpacity + Math.sin(time * s.speed + s.phase) * s.twinkleRange;

			ctx.beginPath();
			ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
			ctx.fillStyle = `rgba(255, 245, 252, ${Math.max(0.1, Math.min(1, a))})`;
			ctx.fill();
			});

			// Kayan yıldızlar
			spawnShootingStar();
			shooting = shooting.filter(s => s.alpha > 0);
			shooting.forEach(s => {
			ctx.save();
			ctx.translate(s.x, s.y);
			ctx.rotate(s.angle);
			const grad = ctx.createLinearGradient(0, 0, s.len, 0);
			grad.addColorStop(0, `rgba(255,255,255,0)`);
			grad.addColorStop(0.5, `rgba(255,220,230,${s.alpha})`);
			grad.addColorStop(1, `rgba(255,255,255,0)`);
			ctx.strokeStyle = grad;
			ctx.lineWidth = 1.0;
			ctx.beginPath();
			ctx.moveTo(0, 0);
			ctx.lineTo(s.len, 0);
			ctx.stroke();
			ctx.restore();
			s.x += s.speed * Math.cos(s.angle);
			s.y += s.speed * Math.sin(s.angle);
			s.alpha -= 0.015;
			});
			}

			// ── HERO HEART SVG ──
			(function buildHeart() {
			const svg = document.getElementById('heroHeart');
			const NS = 'http://www.w3.org/2000/svg';
			const cx = 110, cy = 95;

			const defs = document.createElementNS(NS, 'defs');
			defs.innerHTML = `
			<filter id="glow">
				<feGaussianBlur stdDeviation="3" result="blur"/>
				<feMerge>
					<feMergeNode in="blur"/>
					<feMergeNode in="SourceGraphic"/>
				</feMerge>
			</filter>
			`;
			svg.appendChild(defs);

			function heartPoint(t) {
			const scale = 72;
			const x = scale * 16 * Math.pow(Math.sin(t), 3) / 16;
			const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 16;
			return [cx + x, cy + y];
			}

			const particleCount = 130;
			for (let i = 0; i < particleCount; i++) {
    const t = (i / particleCount) * Math.PI * 2;
    const [px, py] = heartPoint(t);
    const r = Math.random() * 3.5 + 1; 
    const hue = 330 + Math.random() * 40;
    const sat = 70 + Math.random() * 30;
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('cx', px + (Math.random()-0.5)*10);
    circle.setAttribute('cy', py + (Math.random()-0.5)*10);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', `hsl(${hue},${sat}%,80%)`);
    circle.setAttribute('opacity', Math.random() * 0.8 + 0.4);
    circle.setAttribute('filter', 'url(#glow)');
    const anim = document.createElementNS(NS, 'animate');
    anim.setAttribute('attributeName', 'opacity');
    anim.setAttribute('values', `${circle.getAttribute('opacity')};0.2;${circle.getAttribute('opacity')}`);
    anim.setAttribute('dur', `${1.5 + Math.random()*2}s`);
    anim.setAttribute('repeatCount', 'indefinite');
    anim.setAttribute('begin', `${Math.random()*2}s`);
    circle.appendChild(anim);
    svg.appendChild(circle);
  }

  for (let i = 0; i < 45; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * 45;
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist * 0.8;
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', px);
    dot.setAttribute('cy', py);
    dot.setAttribute('r', Math.random() * 2.5 + 0.5);
    dot.setAttribute('fill', `rgba(255,${150 + Math.floor(Math.random()*80)},${180 + Math.floor(Math.random()*60)},0.7)`);
    svg.appendChild(dot);
  }
})();

// ── COUNTDOWN ──
function pad(n) { return String(n).padStart(2, '0'); }

let prevSecs = -1;
function updateTimer() {
  const now = new Date();
  const diff = now - START_DATE;
  if (diff < 0) { document.getElementById('tDays').textContent = '0'; return; }

  const totalS = Math.floor(diff / 1000);
  const s = totalS % 60;
  const m = Math.floor(totalS / 60) % 60;
  const h = Math.floor(totalS / 3600) % 24;
  const d = Math.floor(totalS / 86400);

  document.getElementById('tDays').textContent = d;
  document.getElementById('tHours').textContent = pad(h);
  document.getElementById('tMins').textContent = pad(m);
  document.getElementById('tSecs').textContent = pad(s);
  document.getElementById('totalSecs').textContent = totalS.toLocaleString('tr-TR');

  if (s !== prevSecs) {
    const el = document.getElementById('tSecs');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
    prevSecs = s;
  }
}

updateTimer();
setInterval(updateTimer, 1000);

// ── LETTER TYPEWRITER ──
(function typeLetter() {
  const container = document.getElementById('letterText');
  let pIdx = 0, cIdx = 0;
  let currentP = null, currentSpan = null;

  function nextChar() {
    if (pIdx >= LETTER_PARAGRAPHS.length) return;
    const para = LETTER_PARAGRAPHS[pIdx];

    if (cIdx === 0) {
      currentP = document.createElement('p');
      currentSpan = document.createElement('span');
      currentSpan.className = 'typewriter-wrap';
      currentP.appendChild(currentSpan);
      container.appendChild(currentP);
    }

    if (cIdx < para.length) {
      const ch = para[cIdx];
      if (ch === '\n') {
        currentP.innerHTML = currentP.innerHTML.replace('<span class="typewriter-wrap">', '').replace('</span>', '');
			currentP.appendChild(document.createElement('br'));
			currentSpan = document.createElement('span');
			currentSpan.className = 'typewriter-wrap';
			currentP.appendChild(currentSpan);
			} else {
			currentSpan.textContent += ch;
			}
			cIdx++;
			const delay = ch === '.' || ch === ',' ? 140 : ch === '\n' ? 300 : 28 + Math.random() * 20;
			setTimeout(nextChar, delay);
			} else {
			if (currentSpan) {
			currentSpan.classList.remove('typewriter-wrap');
			}
			pIdx++;
			cIdx = 0;
			setTimeout(nextChar, 600);
			}
			}

			const obs = new IntersectionObserver(entries => {
			if (entries[0].isIntersecting) {
			obs.disconnect();
			setTimeout(nextChar, 400);
			}
			}, { threshold: 0.3 });
			obs.observe(document.getElementById('letter'));
			})();

			// ── FLOATING HEARTS on click ──
			document.addEventListener('click', e => {
			const emojis = ['💜','🌸','✨','💕','🌹','💗'];
			for (let i = 0; i < 3; i++) {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = (e.clientX + (Math.random()-0.5)*60) + 'px';
    h.style.top = e.clientY + 'px';
    h.style.animationDelay = (i * 0.12) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3200);
  }

  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.left = e.clientX + 'px';
  r.style.top = e.clientY + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 900);
});

// ── NAV DOTS active ──
const sections = [document.getElementById('hero'), document.getElementById('countdown'), document.getElementById('letter')];
const dots = document.querySelectorAll('.nav-dot');

const sectionObs = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = sections.indexOf(entry.target);
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }
  });
}, { threshold: 0.5 });

sections.forEach(s => sectionObs.observe(s));

// ── ANIMATION LOOP ──
function loop(t) {
  drawStars(t); 
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
		</script>
	</body>
